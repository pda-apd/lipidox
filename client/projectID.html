<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Projects - Lipid Analytic</title>
    <link rel="icon" href="https://cdn.haitrieu.com/wp-content/uploads/2023/10/Icon-CTy-Tap-doan-Phuong-Hoan.png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"  integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"  integrity="sha384-/o6I2CkkWC//PSjvWC/eYN7l3xM3tJm8ZzVkCOfp//W05QcE3mlGskpoHB6XqI+B" crossorigin="anonymous" />
    <link rel="stylesheet" href="./src/css/main.css" />
    <style>
        .project-card { border: none; border-radius: 12px; transition: all 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        #search-sort-bar { gap: 0.5rem; }
        #project-search { max-width: 260px; }
        .project-card:hover { transform: translateY(-5px); box-shadow: 0 8px 15px rgba(0,0,0,0.1); }
        .project-card.selected { border: 2px solid #dc3545; background: #fff5f5; }
        .status-badge { font-size: 0.65rem; padding: 4px 10px; border-radius: 20px; text-transform: uppercase; font-weight: bold; }
        body { display: none; }

        /* Command terminal */
    </style>
    <script type="module" src="./src/js/auth-gate.js"></script>
</head>
<body class="bg-light">
    <div id="header-placeholder"></div>
    <main class="container">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
            <div>
                <h2 class="fw-bold mb-0">My Projects</h2>
                <p class="text-muted small mb-0">Manage and track the progress of your analysis</p>
            </div>
            <div class="d-flex gap-2">
                <button id="select-all-btn" class="btn btn-sm btn-outline-secondary">Select All</button>
                <button id="delete-selected-btn" class="btn btn-sm btn-danger">
                    <i class="fa-solid fa-trash-can me-1"></i> Delete
                </button>
<a id="btn-example-data" href="./example.html" class="btn btn-sm btn-outline-success px-3">
<i class="fa-solid fa-flask me-1"></i> Example Data
</a>
<a id="btn-idconvert" href="./idconvert.html" class="btn btn-sm btn-outline-info px-3">
<i class="fa-solid fa-barcode me-1"></i> ID Conversion
                </a>
                <a id="btn-create-new" href="./upload.html" class="btn btn-sm btn-primary px-3">
                    <i class="fa-solid fa-plus me-1"></i> Create New
                </a>
            </div>
        </div>
        <!-- Search / Sort bar -->
        <div id="search-sort-bar" class="d-flex flex-wrap align-items-center mb-3">
            <div class="input-group input-group-sm" style="max-width:260px;">
                <span class="input-group-text bg-white"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
                <input id="project-search" type="text" class="form-control border-start-0" placeholder="Search project name…">
            </div>
            <select id="project-sort" class="form-select form-select-sm" style="max-width:180px;">
                <option value="lastAccessed">Last Accessed</option>
                <option value="createdDesc">Date Upload (newest)</option>
                <option value="createdAsc">Date Upload (oldest)</option>
                <option value="nameAZ">Name A → Z</option>
                <option value="nameZA">Name Z → A</option>
            </select>
        </div>
        <div id="project-list-container" class="row g-4">
            <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="text-muted mt-2">Loading project list...</p>
            </div>
        </div>
    </main>
    <!-- Rename Modal -->
    <div class="modal fade" id="renameModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content border-0 shadow">
                <div class="modal-body p-4">
                    <h5 class="fw-bold mb-3"><i class="fa-solid fa-pen me-2 text-primary"></i>Rename Project</h5>
                    <input type="text" id="rename-input" class="form-control mb-3" placeholder="New project name" maxlength="80" />
                    <div class="d-flex gap-2">
                        <button class="btn btn-light w-100" data-bs-dismiss="modal">Cancel</button>
                        <button id="confirm-rename-btn" class="btn btn-primary w-100">Save</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="deleteModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content border-0 shadow">
                <div class="modal-body text-center p-4">
                    <i class="fa-solid fa-circle-exclamation text-danger fa-3x mb-3"></i>
                    <h5 class="fw-bold">Confirm Deletion?</h5>
                    <p class="small text-muted">You are about to delete <b id="delete-count"></b> projects.</p>
                    <div class="d-flex gap-2 mt-4">
                        <button class="btn btn-light w-100" data-bs-dismiss="modal">Cancel</button>
                        <button id="confirm-delete-btn" class="btn btn-danger w-100">Delete Now</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="shared-terminal-host"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <script src="./src/js/header-loader.js"></script>
    <script type="module" src="./src/js/projectID.js"></script> 
</body>
</html>
