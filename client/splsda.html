<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sPLS-DA - Lipid Analytic</title>
    <link rel="icon" href="./src/img/logo1.png" type="image/png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"  integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"  integrity="sha384-/o6I2CkkWC//PSjvWC/eYN7l3xM3tJm8ZzVkCOfp//W05QcE3mlGskpoHB6XqI+B" crossorigin="anonymous" />
    <link rel="stylesheet" href="./src/css/main.css" />
    <script type="module" src="./src/js/auth-gate.js"></script>
    <style>
        .config-panel { flex: 0 0 350px; width: 350px; display: flex; flex-direction: column; overflow: hidden; }
        .results-panel { flex: 1 1 0; min-width: 0; overflow: hidden; }
    </style>
</head>
<body class="analysis-page">
    <div class="main-wrapper">
        <div id="sidebar-placeholder"></div>
        <main class="content-area">
            <section class="config-panel">
                <div class="setup-card">
                    <h6 class="fw-bold mb-2 text-success"><i class="fa-solid fa-layer-group me-2"></i>sPLS-DA</h6>

                    <div class="history-anchor mb-2">
                        <button id="historyToggle" type="button" class="btn btn-outline-secondary btn-sm w-100">
                            <i class="fa-solid fa-clock-rotate-left me-1"></i> History
                        </button>
                        <div id="historyPopup" class="history-popup"></div>
                    </div>

                    <div class="card-scroll">
                        <div class="mb-2">
                            <button class="section-toggle" type="button" data-bs-toggle="collapse" data-bs-target="#analysisSectionBody" aria-expanded="true" aria-controls="analysisSectionBody">
                                <span>sPLS-DA Configuration</span>
                                <i class="fa-solid fa-chevron-down"></i>
                            </button>
                            <div class="collapse show" id="analysisSectionBody">
                                <div class="section-body">
                                    <div class="mb-2">
                                        <label for="splsdaNameInput" class="small-heading">Analysis Name</label>
                                        <input id="splsdaNameInput" type="text" class="form-control form-control-sm" placeholder="example_splsda_batchA">
                                    </div>
                                    <div class="mb-2">
                                        <label for="splsdaTargetMeta" class="small-heading">Target Metadata (Required)</label>
                                        <select id="splsdaTargetMeta" class="form-select form-select-sm"></select>
                                    </div>
                                    <div class="mb-2" id="splsdaGroupSection">
                                        <label class="small-heading mb-1">Groups to include (select ≥ 2)</label>
                                        <div id="splsdaGroupList" class="meta-list" style="max-height:140px; overflow-y:auto;">
                                            <div class="history-meta">Select a target metadata first.</div>
                                        </div>
                                        <div class="d-flex gap-1 mt-1">
                                            <button type="button" id="splsdaSelectAllGroups" class="btn btn-outline-secondary btn-sm py-0 px-2 extra-small">All</button>
                                            <button type="button" id="splsdaClearGroups" class="btn btn-outline-secondary btn-sm py-0 px-2 extra-small">None</button>
                                        </div>
                                    </div>
                                    <div class="mb-2">
                                        <label for="splsdaNcomp" class="small-heading">ncomp — Number of components (2–10)</label>
                                        <input id="splsdaNcomp" type="number" class="form-control form-control-sm" value="2" min="2" max="10">
                                    </div>
                                    <div class="mb-2">
                                        <label for="splsdaKeepX" class="small-heading">keepX — Features per component (comma-separated)</label>
                                        <input id="splsdaKeepX" type="text" class="form-control form-control-sm" value="50,50" placeholder="e.g. 50,50 for 2 components">
                                        <div class="history-meta mt-1">One value per component. Extra values are ignored; missing values repeat the last one.</div>
                                    </div>
                                    <div class="mb-2">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="splsdaScale" checked>
                                            <label class="form-check-label small-heading mb-0" for="splsdaScale">scale (center and scale X)</label>
                                        </div>
                                    </div>
                                    <div class="mb-2">
                                        <label for="splsdaCvFolds" class="small-heading">cv_folds</label>
                                        <input id="splsdaCvFolds" type="number" class="form-control form-control-sm" value="5" min="2" max="20">
                                    </div>
                                    <button id="runSplsdaBtn" class="btn btn-success btn-sm w-100 fw-bold">Run sPLS-DA</button>
                                    <div id="splsdaStatus" class="status-line mt-1"></div>
                                </div>
                            </div>
                        </div>

                        <div id="vizSettingsLeft" style="display:none; margin-top:0.5rem; padding-top:0.5rem; border-top:1px solid #edf1f5;">
                            <div id="metricInfo" class="metric-box">R2X: - | Var Comp1: - | Var Comp2: -</div>
                            <div class="mb-2">
                                <div class="d-flex align-items-center justify-content-between mb-1 gap-1">
                                    <label for="colorBySelect" class="small-heading mb-0">Color By Metadata</label>
                                    <div class="d-flex align-items-center gap-1">
                                        <button id="btnMetadataManager" type="button" class="btn btn-outline-secondary btn-sm py-0 px-2">⚙️</button>
                                    </div>
                                </div>
                                <select id="colorBySelect" class="form-select form-select-sm"></select>
                            </div>
                            <div class="mb-2">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="ellipseToggle">
                                    <label class="form-check-label" for="ellipseToggle">Show Ellipse (95%)</label>
                                </div>
                            </div>
                            <div class="mb-2">
                                <div class="d-flex align-items-center justify-content-between mb-1">
                                    <div class="small-heading mb-0">Legend + Interaction</div>
                                    <button id="btnAppendMetadata" type="button" class="btn btn-outline-primary btn-sm py-0 px-2" disabled>Append to</button>
                                </div>
                                <div id="legendList" class="legend-list"></div>
                            </div>
                            <div class="mb-2">
                                <label for="paletteSelect" class="small-heading">Color Palette</label>
                                <select id="paletteSelect" class="form-select form-select-sm">
                                    <option value="tableau">Tableau 10</option>
                                    <option value="set2">Set 2</option>
                                    <option value="dark2">Dark 2</option>
                                    <option value="vivid" selected>Vivid Bright</option>
                                    <option value="neon">Neon Contrast</option>
                                </select>
                            </div>
                            <div id="pcVarianceInfo" class="pc-variance"></div>
                            <div class="feature-side-controls">
                                <div class="feature-control-row">
                                    <div class="feature-search-popup">
                                        <label for="featureSearchInput" class="small-heading mb-1">Search Feature</label>
                                        <input id="featureSearchInput" type="text" class="form-control form-control-sm" placeholder="Type feature name...">
                                        <div id="featureSearchResults" class="feature-search-results"></div>
                                    </div>
                                    <div>
                                        <label for="featureScaleMode" class="small-heading mb-1">View</label>
                                        <select id="featureScaleMode" class="form-select form-select-sm">
                                            <option value="normalize" selected>Normalize</option>
                                            <option value="raw">Raw</option>
                                            <option value="row_zscore">Row Z-score</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="feature-selected-header">
                                    <div class="small-heading mb-0">Features</div>
                                    <button id="featureClearAllBtn" type="button" class="btn btn-outline-secondary btn-sm py-0 px-2">Clear all</button>
                                </div>
                                <div id="featureSelectedList" class="feature-selected-list">
                                    <div class="feature-selected-empty">No saved features.</div>
                                </div>
                            </div>
                            <div id="featurePanel" class="feature-panel">
                                <div></div>
                                <div class="feature-distribution">
                                    <div id="featureDistributionPlot"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <section class="results-panel">
                <div class="viz-shell">
                    <div id="vizEmpty" class="viz-empty">Run sPLS-DA or load a saved run from history to show visualization and legend.</div>
                    <div id="vizContent" class="viz-content" style="position:relative">
                        <div id="plot-config-anchor" style="position:absolute;top:8px;right:8px;z-index:100;"></div>
                        <div class="plot-panel"><div id="plotWrap"></div><div id="featureOverlayLegend" class="feature-overlay-legend"></div></div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <script src="./src/js/vendor/plotly-2.35.2.min.js"></script>
    <script type="module" src="./src/js/splsda.js"></script>
</body>
</html>
