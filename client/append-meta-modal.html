<div class="modal fade" id="appendMetaModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h6 class="modal-title">Append to Metadata</h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div id="appendMetaSummary" class="small text-muted mb-2"></div>
                <div class="mb-2">
                    <label class="form-label small mb-1">Mode</label>
                    <select id="appendMetaMode" class="form-select form-select-sm">
                        <option value="append">Append to existing metadata</option>
                        <option value="create">Create new metadata</option>
                    </select>
                </div>
                <div class="mb-2" id="appendMetaExistingWrap">
                    <label class="form-label small mb-1">Existing metadata column</label>
                    <select id="appendMetaExistingCol" class="form-select form-select-sm"></select>
                </div>
                <div class="mb-2 d-none" id="appendMetaCreateWrap">
                    <label class="form-label small mb-1">New metadata name</label>
                    <input id="appendMetaCreateCol" type="text" class="form-control form-control-sm" placeholder="new_metadata_column" />
                </div>
                <div class="mb-2">
                    <label class="form-label small mb-1">Label name for selected samples</label>
                    <input id="appendMetaLabel" type="text" class="form-control form-control-sm" placeholder="--Name--" />
                </div>
                <div id="appendMetaError" class="small text-danger"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-light btn-sm" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary btn-sm" id="appendMetaOkBtn">OK</button>
            </div>
        </div>
    </div>
</div>
