<div class="modal fade" id="metadataManagerModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h6 class="modal-title" id="metadataManagerTitle">Metadata Manager</h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="small text-muted mb-2" id="metadataManagerSummary"></div>

                <div class="row g-3">
                    <div class="col-12 col-lg-4">
                        <div class="d-flex align-items-center justify-content-between mb-2">
                            <button type="button" class="btn btn-outline-primary btn-sm py-0 px-2" id="metadataManagerCreateBtn">Create</button>
                        </div>
                        <div class="small fw-semibold mb-2" id="metadataManagerLeftTitle">Metadata columns</div>
                        <div id="metadataManagerLeft" class="border rounded p-2" style="max-height:450px;overflow:auto;"></div>
                    </div>

                    <div class="col-12 col-lg-8">
                        <div class="small fw-semibold mb-2" id="metadataManagerRightTitle">Labels</div>
                        <div id="metadataManagerRight" class="border rounded p-2" style="max-height:450px;overflow:auto;"></div>
                    </div>
                </div>
                
                <div id="metadataManagerError" class="small text-danger mt-3"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-light btn-sm" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary btn-sm" id="metadataManagerOkBtn">Apply</button>
            </div>
        </div>
    </div>
</div>
