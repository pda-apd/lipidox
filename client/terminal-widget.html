<style id="terminal-widget-style">
    .sidebar-terminal-widget { position: relative; z-index: 2147483600; }
    .sidebar-terminal-toggle {
        width: 100%;
        border: 1px solid #d9e2ea;
        background: #fff;
        color: #22384a;
        border-radius: 14px;
        padding: 0.55rem 0.7rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        font-size: 0.74rem;
        font-weight: 700;
        box-shadow: 0 8px 18px rgba(18, 32, 48, 0.08);
    }
    .sidebar-terminal-toggle .terminal-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sidebar-terminal-panel {
        position: fixed;
        left: 68px;
        bottom: 12px;
        width: min(460px, calc(100vw - 92px));
        height: 280px;
        display: none;
        flex-direction: column;
        border-radius: 16px;
        overflow: hidden;
        border: 1px solid #132030;
        background: #08111a;
        box-shadow: 0 20px 38px rgba(6, 15, 22, 0.28);
        z-index: 2147483646;
    }
    .sidebar-terminal-widget.open .sidebar-terminal-panel { display: flex; }
    .sidebar-terminal-widget.is-floating-left {
        position: fixed;
        left: 16px;
        bottom: 16px;
        width: auto;
        z-index: 2147483600;
    }
    .sidebar-terminal-widget.is-floating-left .sidebar-terminal-toggle {
        width: auto;
        min-width: 134px;
        max-width: min(220px, calc(100vw - 32px));
        border-radius: 999px;
        padding: 0.55rem 0.9rem;
        background: rgba(255, 255, 255, 0.96);
        backdrop-filter: blur(10px);
    }
    .sidebar-terminal-widget.is-floating-left .sidebar-terminal-panel {
        position: absolute;
        left: 0;
        bottom: calc(100% + 10px);
        width: min(440px, calc(100vw - 32px));
        max-width: calc(100vw - 32px);
        height: min(300px, 58vh);
    }
    .sidebar-terminal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        padding: 0.55rem 0.75rem;
        background: #132030;
        color: #eaf3fb;
        font-size: 0.74rem;
        font-weight: 700;
    }
    .sidebar-terminal-body {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        padding: 0.7rem 0.75rem;
        font-family: Consolas, Monaco, monospace;
        font-size: 0.72rem;
        color: #82f28d;
        line-height: 1.35;
    }
    .sidebar-terminal-line { white-space: pre-wrap; word-break: break-word; margin-bottom: 0.18rem; }
    .sidebar-terminal-placeholder { color: #86a3bc; }
    @media (max-width: 640px) {
        .sidebar-terminal-widget.is-floating-left {
            left: 12px;
            right: 12px;
            bottom: 12px;
        }
        .sidebar-terminal-widget.is-floating-left .sidebar-terminal-toggle {
            width: 100%;
            max-width: none;
            justify-content: space-between;
        }
        .sidebar-terminal-widget.is-floating-left .sidebar-terminal-panel {
            width: calc(100vw - 24px);
            height: min(280px, 52vh);
        }
    }
</style>

<template id="terminal-widget-template">
    <div class="sidebar-terminal-widget" data-terminal-root>
        <button type="button" class="sidebar-terminal-toggle" data-terminal-toggle>
            <span><i class="fa-solid fa-terminal me-2"></i><span class="terminal-label">Server Log</span></span>
            <i class="fa-solid fa-chevron-up small"></i>
        </button>
        <div class="sidebar-terminal-panel" data-terminal-panel>
            <div class="sidebar-terminal-header">
                <span><i class="fa-solid fa-terminal me-2"></i>Server Log</span>
                <button type="button" class="btn btn-sm btn-outline-light py-0 px-2" data-terminal-close><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="sidebar-terminal-body" data-terminal-body>
                <div class="sidebar-terminal-placeholder">Open terminal log to stream backend output.</div>
            </div>
        </div>
    </div>
</template>
