<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOM Clustering - Lipid Analytic</title>
    <link rel="icon" href="./src/img/logo1.png" type="image/png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"  integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"  integrity="sha384-/o6I2CkkWC//PSjvWC/eYN7l3xM3tJm8ZzVkCOfp//W05QcE3mlGskpoHB6XqI+B" crossorigin="anonymous" />
    <link rel="stylesheet" href="./src/css/main.css" />
    <script type="module" src="./src/js/auth-gate.js"></script>
    <style>
        .config-panel { flex: 0 0 350px; width: 350px; display: flex; flex-direction: column; overflow: hidden; }
        .results-panel { flex: 1 1 0; min-width: 0; overflow: hidden; }
    </style>
</head>

<body class="analysis-page">
    <div class="main-wrapper">
        <div id="sidebar-placeholder"></div>
        <main class="content-area">
            <section class="config-panel">
                <div class="setup-card">
                    <h6 class="fw-bold mb-2" style="color:#c27c0e"><i class="fa-solid fa-wave-square me-2"></i>SOM
                        Clustering</h6>

                    <div class="history-anchor mb-2">
                        <button id="historyToggle" type="button" class="btn btn-outline-secondary btn-sm w-100">
                            <i class="fa-solid fa-clock-rotate-left me-1"></i> History
                        </button>
                        <div id="historyPopup" class="history-popup"></div>
                    </div>

                    <div class="card-scroll">
                        <div class="mb-2">
                            <button class="section-toggle" type="button" data-bs-toggle="collapse"
                                data-bs-target="#somConfigBody" aria-expanded="true" aria-controls="somConfigBody">
                                <span>User Config</span>
                                <i class="fa-solid fa-chevron-down"></i>
                            </button>
                            <div class="collapse show" id="somConfigBody">
                                <div class="section-body">
                                    <div class="mb-2">
                                        <label for="somNameInput" class="small-heading">Analysis Name</label>
                                        <input id="somNameInput" type="text" class="form-control form-control-sm"
                                            placeholder="e.g. som_case_vs_ctrl">
                                        <div id="somNamePreview" class="name-preview mt-1"></div>
                                    </div>

                                    <div class="mb-2">
                                        <label for="somInputSelect" class="small-heading">Input Source</label>
                                        <select id="somInputSelect" class="form-select form-select-sm">
                                            <option value="" selected>--Select--</option>
                                        </select>
                                    </div>

                                    <!-- Run New PCA Checkbox -->

                                    <div class="row g-2 mb-2">
                                        <div class="col-6">
                                            <label for="somXDimInput" class="small-heading">X dimension</label>
                                            <input id="somXDimInput" type="number" class="form-control form-control-sm"
                                                value="8" min="1" max="50">
                                        </div>
                                        <div class="col-6">
                                            <label for="somYDimInput" class="small-heading">Y dimension</label>
                                            <input id="somYDimInput" type="number" class="form-control form-control-sm"
                                                value="8" min="1" max="50">
                                        </div>
                                    </div>

                                    <div class="mb-2">
                                        <label for="somInitSelect" class="small-heading">Initialization</label>
                                        <select id="somInitSelect" class="form-select form-select-sm">
                                            <option value="random">Random</option>
                                            <option value="linear">Linear</option>
                                            <option value="sample" selected>Sample</option>
                                        </select>
                                    </div>

                                    <div class="mb-2">
                                        <label for="somNeighborhoodSelect" class="small-heading">Neighbourhood</label>
                                        <select id="somNeighborhoodSelect" class="form-select form-select-sm">
                                            <option value="gaussian" selected>Gaussian</option>
                                            <option value="bubble">Bubble</option>
                                        </select>
                                    </div>

                                    <div class="mb-2">
                                        <label for="somLayoutSelect" class="small-heading">Layout (Feature
                                            Overview)</label>
                                        <select id="somLayoutSelect" class="form-select form-select-sm">
                                            <option value="overlay" selected>Overlay</option>
                                            <option value="separate">Separate</option>
                                        </select>
                                    </div>

                                    <div class="mb-2">
                                        <label for="somMetaColSelect" class="small-heading">Group / Sort By
                                            Metadata</label>
                                        <select id="somMetaColSelect" class="form-select form-select-sm">
                                            <option value="">-- No metadata --</option>
                                        </select>
                                    </div>

                                    <div class="mb-2">
                                        <div class="small-heading mb-1">Labels <span
                                                class="text-muted fw-normal">(select samples to train SOM)</span></div>
                                        <div id="somLabelList" class="legend-list" style="max-height:140px;"></div>
                                    </div>

                                    <div class="mb-2">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="runNewPcaCheckbox">
                                            <label class="form-check-label" for="runNewPcaCheckbox">Run New PCA (subset only)</label>
                                        </div>
                                    </div>

                                    <button id="runSomBtn" class="btn btn-sm w-100 fw-bold"
                                        style="background:#c27c0e;color:#fff;">
                                        <i class="fa-solid fa-play me-1"></i> Run SOM
                                    </button>
                                    <div id="somStatus" class="status-line mt-1"></div>
                                </div>
                            </div>
                        </div>

                        <div id="somResultPanel"
                            style="display:none; margin-top:0.5rem; padding-top:0.5rem; border-top:1px solid #edf1f5;">
                            <div class="mb-2">
                                <div class="d-flex align-items-center justify-content-between mb-1 gap-1">
                                    <label for="colorBySelect" class="small-heading mb-0">Color By Metadata</label>
                                    <div class="d-flex align-items-center gap-1">
                                        <button id="btnMetadataManager" type="button" class="btn btn-outline-secondary btn-sm py-0 px-2">⚙️</button>
                                    </div>
                                </div>
                                <select id="colorBySelect" class="form-select form-select-sm">
                                    <option value="__som_cluster__">SOM Cluster</option>
                                </select>
                            </div>

                            <div class="mb-2">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="ellipseToggle">
                                    <label class="form-check-label" for="ellipseToggle">Show Ellipse (95%)</label>
                                </div>
                            </div>

                            <div class="mb-2">
                                <div class="d-flex align-items-center justify-content-between mb-1">
                                    <div class="small-heading mb-0">Legend + Interaction</div>
                                    <button id="btnAppendMetadata" type="button" class="btn btn-outline-primary btn-sm py-0 px-2" disabled>Append to</button>
                                </div>
                                <div id="legendList" class="legend-list"></div>
                            </div>

                            <div class="mb-2">
                                <label for="paletteSelect" class="small-heading">Color Palette</label>
                                <select id="paletteSelect" class="form-select form-select-sm">
                                    <option value="tableau">Tableau 10</option>
                                    <option value="set2">Set 2</option>
                                    <option value="dark2">Dark 2</option>
                                    <option value="vivid" selected>Vivid Bright</option>
                                    <option value="neon">Neon Contrast</option>
                                </select>
                            </div>

                            <div id="pcVarianceInfo" class="mb-2" style="font-size:0.69rem;color:#6c757d;"></div>

                            <div class="mb-2">
                                <button class="save-meta-toggle" type="button" data-bs-toggle="collapse" data-bs-target="#saveMetaPanel" aria-expanded="false" aria-controls="saveMetaPanel">
                                    <span>Save to metadata?</span>
                                    <i class="fa-solid fa-chevron-down"></i>
                                </button>
                                <div class="collapse" id="saveMetaPanel">
                                    <div class="save-meta-body">
                                        <div class="mb-2">
                                            <div class="small-heading mb-1">Rename Clusters</div>
                                            <div class="mb-1">
                                                <input id="clusterColName" type="text" class="form-control form-control-sm"
                                                    placeholder="e.g. som_condition">
                                            </div>
                                            <div id="clusterRenameList"></div>
                                        </div>

                                        <button id="saveToMetaBtn" class="btn btn-success btn-sm w-100 fw-bold">
                                            <i class="fa-solid fa-floppy-disk me-1"></i> Save to Metadata
                                        </button>
                                        <div id="saveStatus" class="status-line mt-1"></div>
                                    </div>
                                </div>
                            </div>

                            <div class="feature-side-controls">
                                <!-- <div class="small-heading mb-1">Feature-In</div> -->
                                <div class="feature-control-row">
                                    <div class="feature-search-popup">
                                        <label for="featureSearchInput" class="small-heading mb-1">Search Feature</label>
                                        <input id="featureSearchInput" type="text" class="form-control form-control-sm" placeholder="Type feature name...">
                                        <div id="featureSearchResults" class="feature-search-results"></div>
                                    </div>
                                    <div>
                                        <label for="featureScaleMode" class="small-heading mb-1">View</label>
                                        <select id="featureScaleMode" class="form-select form-select-sm">
                                            <option value="normalize" selected>Normalize</option>
                                            <option value="raw">Raw</option>
                                            <option value="row_zscore">Row Z-score</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="feature-selected-header">
                                    <div class="small-heading mb-0">Features</div>
                                    <button id="featureClearAllBtn" type="button" class="btn btn-outline-secondary btn-sm py-0 px-2">Clear all</button>
                                </div>
                                <div id="featureSelectedList" class="feature-selected-list">
                                    <div class="feature-selected-empty">No saved features.</div>
                                <!-- </div>
                                <div id="featureSearchStatus" class="feature-search-status">Load a SOM run to enable feature search.</div>
                                <div id="featureCurrentSummary" class="feature-current mt-2">No feature selected.</div> -->
                            </div>

                            <div id="featurePanel" class="feature-panel">
                                <div>
                                    <!-- <div class="feature-panel-title">Expression Distribution</div> -->
                                    <!-- <div class="feature-panel-note">One combined half-violin plus one combined boxplot for the selected feature.</div> -->
                                </div>
                                <div class="feature-distribution">
                                    <div id="featureDistributionPlot"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <section class="results-panel">
                <div class="viz-shell">
                    <div id="vizEmpty" class="viz-empty">
                        <div>
                            <i class="fa-solid fa-wave-square fa-2x mb-2" style="color:#e0b36f"></i><br>
                            Run SOM or load a saved run from history to display the clustering result.
                        </div>
                    </div>
                    <div id="vizContent" class="viz-content" style="position:relative">
                        <div id="plot-config-anchor" style="position:absolute;top:8px;right:8px;z-index:100;"></div>
                        <div class="plot-panel">
                            <div id="plotWrap"></div>
                            <div id="featureOverlayLegend" class="feature-overlay-legend"></div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <script src="./src/js/vendor/plotly-2.35.2.min.js"></script>
    <script type="module" src="./src/js/som.js"></script>
</body>

</html>
