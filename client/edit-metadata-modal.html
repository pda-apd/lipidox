<div class="modal fade" id="editMetadataModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h6 class="modal-title">Edit Metadata</h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="small text-muted mb-2" id="editMetaSummary"></div>
                <div class="mb-3">
                    <label class="form-label small mb-1">Metadata name</label>
                    <div class="d-flex align-items-center gap-2">
                        <input id="editMetaCurrentName" class="form-control form-control-sm" type="text" disabled>
                        <span class="small text-muted">-></span>
                        <input id="editMetaNewName" class="form-control form-control-sm" type="text" placeholder="--Name--">
                    </div>
                </div>
                <div class="small fw-semibold mb-2">Label rename</div>
                <div id="editMetaRows" class="d-flex flex-column gap-2"></div>
                <div id="editMetaError" class="small text-danger mt-2"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-light btn-sm" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary btn-sm" id="editMetaOkBtn">Apply</button>
            </div>
        </div>
    </div>
</div>
