<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Lipid Analytic</title>

    <link rel="shortcut icon" href="https://cdn.haitrieu.com/wp-content/uploads/2023/10/Icon-CTy-Tap-doan-Phuong-Hoan.png">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha384-t1nt8BQoYMLFN5p42tRAtuAAFQaCQODekUVeKKZrEnEyp4H2R0RHFz0KWpmj7i8g" crossorigin="anonymous">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="./src/css/main.css">
</head>

<body>

    <div class="page-wrapper">

        <div class="auth-wrapper container">

            <div class="row justify-content-center w-100 g-0">

                <div class="col-xl-10 col-lg-11">

                    <div class="card auth-card">

                        <div class="row g-0">

                            <!-- Left Side -->
                            <div class="col-md-6 auth-image-side d-none d-md-block">

                                <div class="overlay">

                                    <div>

                                        <div class="logo-text">
                                            Lipid Analytic
                                        </div>

                                        <p class="mb-0 opacity-75">
                                            Welcome back. Sign in to continue your work.
                                        </p>

                                    </div>

                                </div>

                            </div>

                            <!-- Right Side -->
                            <div class="col-md-6 auth-form-side">

                                <div class="mb-4">

                                    <a href="index.html" class="text-muted text-decoration-none small">

                                        <i class="fa-solid fa-arrow-left me-1"></i>

                                        Back to Home

                                    </a>

                                </div>

                                <h2 class="fw-bold mb-1">
                                    Sign In
                                </h2>

                                <p class="text-muted mb-4">
                                    Please enter your email and password.
                                </p>

                                <form id="login-form" novalidate>

                                    <!-- Email -->
                                    <div class="form-group">

                                        <div class="input-wrapper">

                                            <span class="icon">
                                                <i class="fa-solid fa-envelope"></i>
                                            </span>

                                            <input
                                                type="email"
                                                class="form-control"
                                                id="email"
                                                placeholder="Email"
                                                required>

                                        </div>

                                        <div id="email-error" class="error-message">
                                            Please enter a valid email address.
                                        </div>

                                    </div>

                                    <!-- Password -->
                                    <div class="form-group">

                                        <div class="input-wrapper">

                                            <span class="icon">
                                                <i class="fa-solid fa-lock"></i>
                                            </span>

                                            <input
                                                type="password"
                                                class="form-control inp-password"
                                                id="password"
                                                placeholder="Password"
                                                required>

                                            <span class="toggle-password">
                                                <i class="fa-solid fa-eye"></i>
                                            </span>

                                        </div>

                                        <div id="password-error" class="error-message">
                                            Please enter your password.
                                        </div>

                                    </div>

                                    <!-- Submit Button -->
                                    <button
                                        type="submit"
                                        class="btn btn-auth w-100 py-2 text-white"
                                        style="background-color: var(--primary-color);">

                                        Sign In

                                    </button>

                                    <!-- Auth Error -->
                                    <div id="login-auth-error" class="error-message text-center mt-2">

                                        Incorrect email or password.

                                    </div>

                                    <!-- Register Redirect -->
                                    <p class="text-center mt-3 mb-0">

                                        Don't have an account?

                                        <a
                                            href="register.html"
                                            class="fw-bold text-decoration-none text-primary">

                                            Sign Up

                                        </a>

                                    </p>

                                </form>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <!-- Login JS -->
    <script type="module" src="./src/js/login.js"></script>

    <script src="./src/js/devtools-guard.js"></script>
</body>

</html>
