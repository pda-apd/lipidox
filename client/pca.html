<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCA/UMAP/t-SNE - Analytic</title>
    <link rel="icon" href="https://cdn.haitrieu.com/wp-content/uploads/2023/10/Icon-CTy-Tap-doan-Phuong-Hoan.png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"  integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"  integrity="sha384-/o6I2CkkWC//PSjvWC/eYN7l3xM3tJm8ZzVkCOfp//W05QcE3mlGskpoHB6XqI+B" crossorigin="anonymous" />
    <link rel="stylesheet" href="./src/css/main.css" />
    <script type="module" src="./src/js/auth-gate.js"></script>
    <style>
        .config-panel { flex: 0 0 350px; width: 350px; display: flex; flex-direction: column; overflow: hidden; }
        .results-panel { flex: 1 1 0; min-width: 0; overflow: hidden; }
        .feature-chip { border: 1px solid #dbe5ef; border-radius: 999px; padding: 0.34rem 0.65rem; background: #fff; color: #334155; font-size: 0.72rem; line-height: 1.1; cursor: pointer; transition: all 0.18s ease; }
        .feature-chip:hover { border-color: #6c757d; color: #3d4a59; }
        .feature-chip.active { border-color: #4b5563; background: #4b5563; color: #fff; box-shadow: 0 8px 18px rgba(75,85,99,0.22); }
    </style>
</head>
<body class="analysis-page">
    <div class="main-wrapper">
        <div id="sidebar-placeholder"></div>
        <main class="content-area">
            <section class="config-panel">
                <div class="setup-card">
                    <h6 class="fw-bold mb-2 text-success"><i class="fa-solid fa-cube me-2"></i>Multivariate Analysis</h6>

                    <!-- History button always visible, outside any collapse -->
                    <div class="history-anchor mb-2">
                        <button id="historyToggle" type="button" class="btn btn-outline-secondary btn-sm w-100">
                            <i class="fa-solid fa-clock-rotate-left me-1"></i> History
                        </button>
                        <div class="extra-small text-muted mt-1">Use <i class="fa-solid fa-star"></i> to set default view (PCA/UMAP/t-SNE).</div>
                        <div id="historyPopup" class="history-popup"></div>
                    </div>

                    <div class="card-scroll">
                        <!-- Single collapsible for both PCA and UMAP/t-SNE -->
                        <div class="mb-2">
                            <button class="section-toggle" type="button" data-bs-toggle="collapse" data-bs-target="#analysisSectionBody" aria-expanded="true" aria-controls="analysisSectionBody">
                                <span>PCA/UMAP/t-SNE</span>
                                <i class="fa-solid fa-chevron-down"></i>
                            </button>
                            <div class="collapse show" id="analysisSectionBody">
                                <div class="section-body">

                                    <!-- PCA sub-section -->
                                    <div class="mb-2 pb-2" style="border-bottom:1px solid #edf1f5">
                                        <div class="small-heading text-success mb-2">PCA</div>
                                        <div class="mb-2">
                                            <label class="small-heading">Dimensions</label>
                                            <div class="d-flex gap-3">
                                                <div class="form-check">
                                                    <input class="form-check-input" type="radio" name="pcaDim" id="pcaAuto" value="0" checked>
                                                    <label class="form-check-label" for="pcaAuto">Auto</label>
                                                </div>
                                                <div class="form-check">
                                                    <input class="form-check-input" type="radio" name="pcaDim" id="pca20" value="20">
                                                    <label class="form-check-label" for="pca20">20 dim</label>
                                                </div>
                                                <div class="form-check">
                                                    <input class="form-check-input" type="radio" name="pcaDim" id="pca50" value="50">
                                                    <label class="form-check-label" for="pca50">50 dim</label>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="mb-2">
                                            <label for="pcaNameInput" class="small-heading">PCA Name</label>
                                            <input id="pcaNameInput" type="text" class="form-control form-control-sm" placeholder="example_batchA">
                                            <div id="pcaNamePreview" class="name-preview mt-1"></div>
                                        </div>
                                        <!-- Batch Correction -->
                                        <div class="mb-2">
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" id="pcaBatchCorrCheck">
                                                <label class="form-check-label" for="pcaBatchCorrCheck">Batch Correction (ComBat)</label>
                                            </div>
                                            <div id="pcaBatchColWrap" class="mt-1" style="display:none;">
                                                <label for="pcaBatchColSelect" class="small-heading">Batch Column</label>
                                                <select id="pcaBatchColSelect" class="form-select form-select-sm">
                                                    <option value="" disabled selected>-- Select meta column --</option>
                                                </select>
                                            </div>
                                        </div>
                                        <button id="runPcaBtn" class="btn btn-success btn-sm w-100 fw-bold">Run PCA</button>
                                        <div id="pcaStatus" class="status-line mt-1"></div>
                                    </div>

                                    <!-- UMAP / t-SNE sub-section -->
                                    <div class="mt-2">
                                        <div class="small-heading text-primary mb-2">UMAP / t-SNE</div>
                                        <div class="mb-2">
                                            <label for="pcaSourceSelect" class="small-heading">PCA Input</label>
                                            <select id="pcaSourceSelect" class="form-select form-select-sm">
                                                <option value="" disabled selected>-- Run PCA first --</option>
                                            </select>
                                        </div>
                                        <div class="mb-2">
                                            <label for="embeddingMethod" class="small-heading">Method</label>
                                            <select id="embeddingMethod" class="form-select form-select-sm">
                                                <option value="UMAP">UMAP</option>
                                                <option value="tSNE">t-SNE</option>
                                            </select>
                                        </div>

                                        <!-- UMAP params -->
                                        <div id="umapParams">
                                            <div class="mb-2">
                                                <label for="umapNeighbors" class="small-heading">n_neighbors</label>
                                                <input id="umapNeighbors" type="number" class="form-control form-control-sm" value="15" min="2" max="200">
                                            </div>
                                            <div class="mb-2">
                                                <label for="umapMinDist" class="small-heading">min_dist</label>
                                                <input id="umapMinDist" type="number" class="form-control form-control-sm" value="0.1" min="0" max="1" step="0.05">
                                            </div>
                                            <div class="mb-2">
                                                <label for="umapMetric" class="small-heading">Metric</label>
                                                <select id="umapMetric" class="form-select form-select-sm">
                                                    <option value="euclidean" selected>Euclidean</option>
                                                    <option value="cosine">Cosine</option>
                                                    <option value="manhattan">Manhattan</option>
                                                    <option value="correlation">Correlation</option>
                                                </select>
                                            </div>
                                        </div>

                                        <!-- t-SNE params -->
                                        <div id="tsneParams" style="display:none;">
                                            <div class="mb-2">
                                                <label for="tsnePerplexity" class="small-heading">Perplexity</label>
                                                <input id="tsnePerplexity" type="number" class="form-control form-control-sm" value="30" min="5" max="100">
                                            </div>
                                            <div class="mb-2">
                                                <label for="tsneLearningRate" class="small-heading">Learning Rate</label>
                                                <input id="tsneLearningRate" type="number" class="form-control form-control-sm" value="200" min="10" max="1000" step="10">
                                            </div>
                                            <div class="mb-2">
                                                <label for="tsneMaxIter" class="small-heading">Max Iterations</label>
                                                <input id="tsneMaxIter" type="number" class="form-control form-control-sm" value="1000" min="250" max="5000" step="250">
                                            </div>
                                        </div>

                                        <div class="mb-2">
                                            <label for="embeddingNameInput" class="small-heading">Embedding Name</label>
                                            <input id="embeddingNameInput" type="text" class="form-control form-control-sm" placeholder="example_embed1">
                                            <div id="embeddingNamePreview" class="name-preview mt-1"></div>
                                        </div>
                                        <button id="runEmbeddingBtn" class="btn btn-primary btn-sm w-100 fw-bold" disabled>Run</button>
                                        <div id="embeddingStatus" class="status-line mt-1"></div>
                                    </div>

                                </div>
                            </div>
                        </div>

                        <!-- Viz settings: shown only after a run is active -->
                        <div id="vizSettingsLeft" style="display:none; margin-top:0.5rem; padding-top:0.5rem; border-top:1px solid #edf1f5;">
                            <!-- 1. Color By Metadata -->
                            <div class="mb-2">
                                <div class="d-flex align-items-center justify-content-between mb-1 gap-1">
                                    <label for="colorBySelect" class="small-heading mb-0">Color By Metadata</label>
                                    <div class="d-flex align-items-center gap-1">
                                        <button id="btnMetadataManager" type="button" class="btn btn-outline-secondary btn-sm py-0 px-2">⚙️</button>
                                    </div>
                                </div>
                                <select id="colorBySelect" class="form-select form-select-sm"></select>
                            </div>
                            <!-- 2. Show Ellipse -->
                            <div class="mb-2">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="ellipseToggle">
                                    <label class="form-check-label" for="ellipseToggle">Show Ellipse (95%)</label>
                                </div>
                            </div>
                            <!-- 3. Legend + Interaction -->
                            <div class="mb-2">
                                <div class="d-flex align-items-center justify-content-between mb-1">
                                    <div class="small-heading mb-0">Legend + Interaction</div>
                                    <button id="btnAppendMetadata" type="button" class="btn btn-outline-primary btn-sm py-0 px-2" disabled>Append to</button>
                                </div>
                                <div id="legendList" class="legend-list"></div>
                            </div>
                            <!-- 4. Color Palette -->
                            <div class="mb-2">
                                <label for="paletteSelect" class="small-heading">Color Palette</label>
                                <select id="paletteSelect" class="form-select form-select-sm">
                                    <option value="tableau">Tableau 10</option>
                                    <option value="set2">Set 2</option>
                                    <option value="dark2">Dark 2</option>
                                    <option value="vivid" selected>Vivid Bright</option>
                                    <option value="neon">Neon Contrast</option>
                                </select>
                            </div>
                            <div class="feature-side-controls">
                                <!-- <div class="small-heading mb-1">Feature-In</div> -->
                                <div class="feature-control-row">
                                    <div class="feature-search-popup">
                                        <label for="featureSearchInput" class="small-heading mb-1">Search Feature</label>
                                        <input id="featureSearchInput" type="text" class="form-control form-control-sm" placeholder="Type feature name...">
                                        <div id="featureSearchResults" class="feature-search-results"></div>
                                    </div>
                                    <div>
                                        <label for="featureScaleMode" class="small-heading mb-1">View</label>
                                        <select id="featureScaleMode" class="form-select form-select-sm">
                                            <option value="normalize" selected>Normalize</option>
                                            <option value="raw">Raw</option>
                                            <option value="row_zscore">Row Z-score</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="feature-selected-header">
                                    <div class="small-heading mb-0">Features</div>
                                    <button id="featureClearAllBtn" type="button" class="btn btn-outline-secondary btn-sm py-0 px-2">Clear all</button>
                                </div>
                                <div id="featureSelectedList" class="feature-selected-list">
                                    <div class="feature-selected-empty">No saved features.</div>
                                <!-- </div>
                                <div id="featureSearchStatus" class="feature-search-status">Load a PCA/UMAP/t-SNE run to enable feature search.</div>
                                <div id="featureCurrentSummary" class="feature-current mt-2">No feature selected.</div> -->
                            </div>
                            <!-- PC Variance -->
                            <div id="pcVarianceInfo" class="pc-variance"></div>
                            <div id="featurePanel" class="feature-panel">
                                <div>
                                    <!-- <div class="feature-panel-title">Expression Distribution</div> -->
                                    <!-- <div class="feature-panel-note">One combined half-violin plus one combined boxplot for the selected feature.</div> -->
                                </div>
                                <div class="feature-distribution">
                                    <div id="featureDistributionPlot"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <section class="results-panel">
                <div class="viz-shell">
                    <div id="vizEmpty" class="viz-empty">
                        Run PCA or load a saved run from history to show visualization and legend.
                    </div>
                    <div id="vizContent" class="viz-content" style="position:relative">
                        <div id="plot-config-anchor" style="position:absolute;top:8px;right:8px;z-index:100;"></div>
                        <div class="plot-panel">
                            <div id="plotWrap"></div>
                            <div id="featureOverlayLegend" class="feature-overlay-legend"></div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <script src="./src/js/vendor/plotly-2.35.2.min.js"></script>
    <script type="module" src="./src/js/pca.js"></script>
</body>
</html>
